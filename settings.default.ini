[spawn]
; 1 = while a player (you or someone joining) is on the "Spawning..." screen, finish every loaded tile
;     right away instead of one tile per 6 host ticks. 0 = game's pacing, only log timings.
boost=1
; Most time spent finishing tiles early per game tick, in ms, while other players are connected
; (they see the host stutter at most this much while someone spawns).
budget_ms=12
; The same when nobody else is connected (single player, or the host spawning alone).
budget_ms_alone=60
; How many vehicles the host loads at once (the game: 1, on its single "vehicle_save" thread, which also
; saves vehicles; saves still run alone and in order). 0 = leave the game's thread alone entirely.
vehicle_load_threads=4
; 1 = under Wine / Proton, each of those threads allocates memory from its own arena. Wine's heap has one lock
;     for the whole game, so 4 loads at once stalled everyone (2026-10-22: 1.5 s per vehicle, the game at 3 fps,
;     a joining client 1600 ticks behind). Windows' heap doesn't have that problem. 2 = also on Windows, 0 = off.
load_heap=1
; 1 = with load_heap on, every other game thread (update, render, vehicle logic, physics) also allocates from an
;     arena of its own (32 more, shared round-robin past 32 threads), not only the load threads: Wine's single heap lock
;     serialises them all during play too. "game heap 60s" lines. 0 = load threads only.
all_threads=1
; Stop boosting after this many seconds even if tiles are still loading.
max_boost_s=90
; The Spawning screen waits at least 30 frames after the host replies: 0.5 s at 60 fps, but seconds at the
; low frame rate of the loading screen. This ends that wait this many ms after the reply instead (0 = 30 frames).
min_wait_ms=500
; Progress line ("spawn: ...") every this many seconds while the Spawning screen is up.
log_every_s=2
watch_world88=0

[load]
; Threads that decode the world's built-in sounds while it loads (the game: one, on the loading thread; about
; 1.7 s of a 9 s load). The upload to OpenAL stays on the game's thread, in order. 0 = the game's own loop.
; Default: cores - 1, at most 8.
;sound_threads=8
; 1 = during a load, a file the game looks for under rom\ or the workshop folder is first checked against a
; listing of its folder; if it isn't there, the game gets "not found" without asking Windows (a load makes
; ~100,000 such lookups; right after a reboot they took ~26 s). Read-only lookups only. 0 = off.
missing_file_cache=1
; The first this many "not found" answers per session are also asked of Windows; any disagreement turns the
; cache off and is logged.
verify_misses=500
; Threads that read rom\ and the workshop folder once in the background when the game starts, so the first load
; after a reboot doesn't pay for opening ~29,000 files one by one (~24 s). Read only, low priority. 0 = off.
warmup_threads=6
